name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Lets release.yml reuse the build so published VSIX files come from the same pipeline.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        # tree-sitter is compiled through cgo, so every target is built on a runner
        # of the same OS/arch. Windows ARM uses LLVM-MinGW for cgo.
        include:
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-latest
            target: darwin-arm64
            e2e: true
          - runner: ubuntu-latest
            target: linux-x64
            e2e: true
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-latest
            target: win32-x64
          - runner: windows-11-arm
            target: win32-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The DAP smoke test runs a real Lua 5.4 under lua/debugger.lua.
      - name: Install Lua 5.4 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4

      - name: Install Lua 5.4 (macOS)
        if: runner.os == 'macOS'
        run: brew install lua@5.4

      - name: Install test frameworks (Linux)
        if: matrix.e2e && runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends luarocks liblua5.4-dev
          luarocks --lua-version=5.4 --tree="$RUNNER_TEMP/lua-test-rocks" install luaunit 3.4
          luarocks --lua-version=5.4 --tree="$RUNNER_TEMP/lua-test-rocks" install busted 2.2.0
          echo "LUA_PATH=$(luarocks --lua-version=5.4 --tree="$RUNNER_TEMP/lua-test-rocks" path --lr-path);;" >> "$GITHUB_ENV"
          echo "LUA_CPATH=$(luarocks --lua-version=5.4 --tree="$RUNNER_TEMP/lua-test-rocks" path --lr-cpath);;" >> "$GITHUB_ENV"

      - name: Install test frameworks (macOS)
        if: matrix.e2e && runner.os == 'macOS'
        run: |
          brew install luarocks
          lua_prefix="$(brew --prefix lua@5.4)"
          luarocks --lua-version=5.4 --lua-dir="$lua_prefix" --tree="$RUNNER_TEMP/lua-test-rocks" install luaunit 3.4
          luarocks --lua-version=5.4 --lua-dir="$lua_prefix" --tree="$RUNNER_TEMP/lua-test-rocks" install busted 2.2.0
          echo "LUA_PATH=$(luarocks --lua-version=5.4 --lua-dir="$lua_prefix" --tree="$RUNNER_TEMP/lua-test-rocks" path --lr-path);;" >> "$GITHUB_ENV"
          echo "LUA_CPATH=$(luarocks --lua-version=5.4 --lua-dir="$lua_prefix" --tree="$RUNNER_TEMP/lua-test-rocks" path --lr-cpath);;" >> "$GITHUB_ENV"

      # cgo on Windows needs a C compiler; the hosted image ships MinGW but keep it explicit.
      - name: Ensure a C compiler (Windows)
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) { choco install mingw --no-progress -y }

      - name: Install LLVM-MinGW (Windows ARM64)
        if: matrix.target == 'win32-arm64'
        shell: pwsh
        run: |
          $toolchain = 'llvm-mingw-20260908-ucrt-aarch64'
          $archive = Join-Path $env:RUNNER_TEMP "$toolchain.zip"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/20260908/$toolchain.zip" -OutFile $archive
          $expected = '7fe35f60407473c420ac72b25137f54385b0affd2c42efd507c0062fc626ab56'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'LLVM-MinGW archive checksum mismatch'
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          $bin = Join-Path $env:RUNNER_TEMP "$toolchain/bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          'CC=aarch64-w64-mingw32-clang' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          'CGO_ENABLED=1' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          'CGO_LDFLAGS=-static' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Vet and test Go packages (race detector where supported)
        run: npm run test:go

      - name: Build Go servers
        run: npm run build:go -- --target ${{ matrix.target }}

      - name: Build extension
        run: npm run build -w vscode

      - name: Smoke test the language server
        run: npm run test:lsp

      # No Lua 5.4 package on the Windows runner; the Lua side is covered on the other platforms.
      - name: Smoke test the debug adapter
        if: runner.os != 'Windows'
        run: npm run test:dap

      # `e2e` runs the extension in a real VS Code; one runner per OS.
      - name: Run end-to-end tests (VS Code)
        if: matrix.e2e && runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: Run end-to-end tests (VS Code)
        if: matrix.e2e && runner.os != 'Linux'
        run: npm run test:e2e

      - name: Package VSIX
        run: npm run package -- --target ${{ matrix.target }}

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: lua-devtools-${{ matrix.target }}
          path: vscode/lua-devtools-${{ matrix.target }}-*.vsix
          if-no-files-found: error
          retention-days: 14

  lua-compatibility:
    name: Lua ${{ matrix.lua }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned official source releases and SHA-256 from https://www.lua.org/ftp/.
          - lua: '5.2.4'
            sha256: b9e2e4aad6789b3b63a056d442f7b39f0ecfca3ae0f1fc0ae4e9614401b69f4b
          - lua: '5.3.6'
            sha256: fc5fd69bb8736323f026672b1b7235da613d7177e72558893a0bdcd320466d60
          - lua: '5.4.9'
            sha256: 2335b6c582a52654f94612bf10d2f4672805d05329aa6568b1d8cd9e5c6fb8e6
          - lua: '5.5.1'
            sha256: 1c4b4068d67061f2a2231ad2b5422e77acea1487ea9890f6320af614f4373dce
    env:
      LUA_TEST_VERSION: ${{ matrix.lua }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build selected Lua release
        env:
          LUA_SHA256: ${{ matrix.sha256 }}
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          archive="lua-$LUA_TEST_VERSION.tar.gz"
          curl --fail --location --retry 3 "https://www.lua.org/ftp/$archive" -o "$archive"
          echo "$LUA_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive"
          # Generic needs only the C compiler and libm, avoiding readline dependencies.
          make -C "lua-$LUA_TEST_VERSION" -j2 generic
          lua_binary="$RUNNER_TEMP/lua-$LUA_TEST_VERSION/src/lua"
          "$lua_binary" -v
          echo "LUA_TEST_BINARY=$lua_binary" >> "$GITHUB_ENV"

      - name: Test debugger and language server with selected Lua (race detector enabled)
        run: go test -race -tags=integration -count=1 -timeout=60s -v ./internal/dap ./internal/lsp

      - name: Build debug adapter
        run: |
          mkdir -p vscode/bin
          go build -o vscode/bin/lua-dap ./cmd/lua-dap

      - name: Smoke test DAP with selected Lua
        run: node scripts/dap-smoke.mjs
