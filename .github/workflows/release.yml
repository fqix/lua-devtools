name: Release

# Publish new releases or manually retry existing release assets; CI never uploads to a store.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose VSIX assets should be republished
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'release'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Marketplace identity's federated credential is bound to this environment.
    environment: marketplace-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Check release tag matches package.json version
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./vscode/package.json').version")"
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error::release tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Download platform VSIX packages
        if: github.event_name == 'release'
        uses: actions/download-artifact@v7
        with:
          pattern: lua-devtools-*
          path: dist
          merge-multiple: true

      - name: Download existing release packages for retry
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --pattern '*.vsix' --dir dist
          for target in darwin-x64 darwin-arm64 linux-x64 linux-arm64 win32-x64 win32-arm64; do
            test -s "dist/lua-devtools-$target-${TAG#v}.vsix"
          done

      # Azure DevOps retires global PATs on 2026-12-01; the Marketplace accepts a
      # managed identity through workload identity federation instead (no secret).
      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce@3 publish --azure-credential --skip-duplicate --packagePath dist/*.vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1 publish --skip-duplicate --packagePath dist/*.vsix

      - name: Attach VSIX packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.vsix --clobber
