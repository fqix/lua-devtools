<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Lua DevTools: a Lua-blue planet with a satellite (Lua's "moon" motif), a breakpoint dot and a step arrow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- planet -->
  <circle cx="122" cy="134" r="66" fill="url(#planet)"/>
  <!-- satellite: the small circle from the Lua logo motif -->
  <circle cx="196" cy="60" r="18" fill="#93c5fd"/>
  <!-- breakpoint dot on the planet -->
  <circle cx="98" cy="118" r="17" fill="#ef4444"/>
  <!-- step-over arrow -->
  <path d="M118 158 h44 l-14 -14 m14 14 l-14 14" fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
