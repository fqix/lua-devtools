<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Lua DevTools, in the palette of the Lua logo: navy planet and white moon on white,
       with an orbit ring; a red breakpoint and a step arrow mark the debugger. -->
  <rect width="256" height="256" rx="56" fill="#ffffff"/>
  <!-- orbit -->
  <circle cx="128" cy="128" r="104" fill="none" stroke="#000080" stroke-width="6" />
  <!-- planet -->
  <circle cx="128" cy="128" r="76" fill="#000080"/>
  <!-- moon, cut into the planet's upper-right like the Lua logo -->
  <circle cx="163" cy="93" r="21" fill="#ffffff"/>
  <!-- moon on the orbit -->
  <circle cx="210" cy="55" r="15" fill="#000080"/>
  <!-- breakpoint -->
  <circle cx="100" cy="112" r="14" fill="#e11d1d"/>
  <!-- step-over arrow -->
  <path d="M104 156 h46 l-14 -14 m14 14 l-14 14" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
